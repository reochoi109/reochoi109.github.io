title = '최신욱 | Backend Engineer'
theme = 'studio'
enableRobotsTXT = true

[module]
  [[module.mounts]]
  source = 'content/ko'
  target = 'content'
  lang = 'ko'

  [[module.mounts]]
  source = 'content/en'
  target = 'content'
  lang = 'en'

[pagination]
