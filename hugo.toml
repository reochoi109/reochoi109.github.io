baseURL = 'https://reochoi109.github.io/'
languageCode = 'en-us'
defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = true
title = 'Reo Portfolio'
theme = 'studio'
enableRobotsTXT = true

# Company-specific portfolio routes reuse the canonical Korean content while
# keeping the company slug in every generated URL.
[module]
  [[module.mounts]]
  source = 'content/ko'
  target = 'content'
  lang = 'ko'

  [[module.mounts]]
  source = 'content/en'
  target = 'content'
  lang = 'en'

  [[module.mounts]]
  source = 'content/ko/products'
  target = 'content/madup/products'
  lang = 'ko'

  [[module.mounts]]
  source = 'content/ko/career'
  target = 'content/madup/career'
  lang = 'ko'

  [[module.mounts]]
  source = 'content/ko/about.md'
  target = 'content/madup/about.md'
  lang = 'ko'

[pagination]
pagerSize = 12

[taxonomies]
tag = 'tags'
category = 'categories'

[params]
description = '기술과 데이터 경험을 바탕으로 고객의 유입과 전환을 다루는 최신욱의 퍼포먼스 마케팅 포트폴리오.'
author = 'Reo'
brand = 'Reo' # Header/footer brand label (defaults to `title`)
email = 'reochoi109@gmail.com' # Optional: footer email under brand (falls back to data/home.toml)
spacing = 'comfortable' # comfortable | compact
company_routes = ['madup'] # Company-specific mirrors that preserve their URL prefix

[languages]
  [languages.ko]
  weight = 1
  languageName = '한국어'
  languageCode = 'ko-kr'
  title = 'Reo Portfolio'
  contentDir = 'content/ko'
    [languages.ko.params]
    brand = 'Reo'
    description = '기술과 데이터 경험을 바탕으로 고객의 유입과 전환을 다루는 최신욱의 퍼포먼스 마케팅 포트폴리오.'
    [languages.ko.menu]
      [[languages.ko.menu.main]]
      name = '홈'
      pageRef = '/'
      weight = 10

      [[languages.ko.menu.main]]
      name = '개인 프로젝트'
      pageRef = '/products'
      weight = 30

      [[languages.ko.menu.main]]
      name = '경력'
      pageRef = '/career'
      weight = 38

      [[languages.ko.menu.main]]
      name = '프로필'
      pageRef = '/about'
      weight = 40

  [languages.en]
  weight = 2
  languageName = 'English'
  languageCode = 'en-us'
  title = 'Reo Portfolio'
  contentDir = 'content/en'
    [languages.en.params]
    brand = 'Reo'
    description = 'A product-minded marketing portfolio connecting audience insight, message, and experience.'
    [languages.en.menu]
      [[languages.en.menu.main]]
      name = 'Home'
      pageRef = '/'
      weight = 10

      [[languages.en.menu.main]]
      name = 'Independent Projects'
      pageRef = '/products'
      weight = 30

      [[languages.en.menu.main]]
      name = 'Career'
      pageRef = '/career'
      weight = 38

      [[languages.en.menu.main]]
      name = 'Profile'
      pageRef = '/about'
      weight = 40

[markup]
  [markup.tableOfContents]
  endLevel = 3
  ordered = false
  startLevel = 2
