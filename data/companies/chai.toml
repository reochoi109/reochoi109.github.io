hero_lead_ko = "개인 웹서비스와 스마트스토어를 운영하며 작은 실행이 노출 결과를 바꾸는 과정을 경험했습니다. 개발을 통해 익힌 문제 해결 방식과 기술 활용 경험을 바탕으로, 데이터와 크리에이티브를 함께 다루는 차이커뮤니케이션에서 성과 개선에 기여하고자 합니다."
