motivation_ko = [
  "연기를 하다가 개발자로 진로를 바꾸었고, 퇴사 후에는 혼자 웹서비스를 만들고 스마트스토어를 운영했습니다. 직접 만든 서비스와 상품을 알리기 위해 SEO를 점검하고, 사이트의 제목과 콘텐츠, 상품명과 검색 키워드를 바꾸며 노출 결과를 확인했습니다. 이 과정에서 만드는 일 자체보다 어떻게 해야 고객에게 발견되고 선택으로 이어질 수 있는지를 고민하는 시간이 점점 늘었습니다. 변화를 시도하고 실제 결과를 확인한 뒤 다음 방법을 찾는 과정에 더 큰 흥미를 느끼면서 퍼포먼스 마케터로 진로를 전환하게 되었습니다.",
  "차이커뮤니케이션의 공고에서 매체 운영뿐 아니라 성과 데이터를 분석하고, 소재와 랜딩페이지의 개선안까지 도출한다는 업무가 눈에 들어왔습니다. 제가 하고 싶은 일도 단순히 광고를 집행하거나 숫자를 정리하는 데서 끝나는 것이 아니라, 결과가 달라진 이유를 찾고 다음 실행으로 연결하는 일이기 때문입니다. 반복 운영을 돕는 CHACHA Works, 전략과 트렌드 리포트를 제공하는 Radar, 입찰가를 모니터링하고 조정하는 Bidding 등 자체 도구로 마케터의 판단을 지원한다는 점에서도, 데이터를 활용해 더 나은 방법을 찾는 제 강점을 살릴 수 있는 환경이라고 생각했습니다.",
  "개발자로 일하며 예상과 다른 결과가 나오면 로그와 데이터를 비교하고, 가능한 원인을 나눈 뒤 하나씩 검증해왔습니다. 개인 웹서비스를 직접 기획하고 구현한 경험을 통해서는 사용자가 어떤 화면과 흐름을 거쳐 행동하는지도 기술적인 구조와 함께 이해할 수 있었습니다. 이러한 경험을 바탕으로 캠페인 성과가 변했을 때 매체, 타깃, 소재, 랜딩페이지를 나누어 원인을 살펴보고, 분석한 내용을 광고주와 동료가 이해할 수 있는 개선안으로 정리하겠습니다.",
  "광고 매체를 직접 운영한 실무 경험은 아직 없지만, 새로운 분야였던 개발에서도 필요한 지식을 빠르게 익혀 역할을 넓혀왔습니다. 그 과정에서 쌓은 문제 해결 방식과 기술에 대한 이해를 이번에는 마케팅 성과를 더 깊이 들여다보는 강점으로 가져가고 싶습니다. 저의 목표는 도구를 만드는 사람이 아니라, 도구와 데이터를 잘 활용해 광고주의 성과를 개선하는 마케터가 되는 것입니다. 그 목표를 차이커뮤니케이션에서 시작하고 싶어 지원했습니다."
]

