motivation_ko = [
  "개인 웹서비스와 스마트스토어를 운영하면서 게시글 제목과 태그, 상품명과 검색 키워드를 바꾸고 노출 결과를 확인했습니다. 작은 변화에도 결과가 달라지는 것을 보며, 직접 시도하고 데이터를 확인해 다음 방법을 고민하는 과정에 흥미를 느꼈습니다. 이러한 경험을 계기로 실행의 결과를 데이터로 확인하고 지속적으로 개선해 나가는 퍼포먼스 마케팅을 새로운 진로로 선택했습니다.",
  "매드업의 솔루션 사업 부문에 지원한 이유는 <strong>데이터를 기반으로 캠페인을 운영하고 지속적으로 개선하면서, AI와 자동화를 활용해 마케터가 분석과 판단에 더욱 집중하는 방식</strong>에 매력을 느꼈기 때문입니다. 특히 단순히 광고를 집행하는 데 그치지 않고 성과 데이터를 분석해 인사이트를 찾고, 이를 다음 전략에 반영한다는 점이 제가 퍼포먼스 마케팅에서 하고 싶은 일과 맞닿아 있다고 생각했습니다.",
  "개발자로 일하며 저 역시 결과만 확인하기보다 원인을 찾고 더 나은 방법을 고민하는 방식으로 문제를 해결해왔습니다. 예상하지 못한 결과가 발생하면 로그와 데이터를 확인하고, 가능한 원인을 가설로 나누어 하나씩 검증하며 문제의 범위를 좁혔습니다. 또한 퍼포먼스 마케터가 PC와 모바일에서 검색광고의 노출 위치를 반복적으로 확인하는 업무를 보고, 이를 자동으로 확인할 수 있는 도구 개발을 도운 경험도 있습니다. 작은 경험이지만 실제 마케팅 업무의 문제를 기술로 해결해보면서, 기술과 자동화가 마케터의 업무를 어떻게 도울 수 있는지도 경험했습니다.",
  "이러한 경험을 바탕으로 매드업에서는 먼저 퍼포먼스 마케팅의 기본기를 빠르게 갖추고 싶습니다. 개발자로서 익혀온 <strong>문제를 정의하고, 데이터를 확인하고, 가설을 검증하며 개선하는 방식</strong>을 캠페인 운영과 성과 분석에도 적용하겠습니다. 여기에 AI와 다양한 도구를 적극적으로 활용하는 역량을 더해, 주어진 업무를 수행하는 데 그치지 않고 결과를 통해 스스로 문제를 발견하고 더 나은 방법을 제안하며 성과 개선에 기여하는 퍼포먼스 마케터로 성장하고자 지원했습니다."
]

future_ko = [
  "입사 후 가장 먼저 해야 할 일은 퍼포먼스 마케터로서 실무의 기본기를 빠르게 갖추는 것이라고 생각합니다. SA, DA, YouTube 등 다양한 광고 매체와 주요 지표를 익히고, 캠페인 운영과 최적화, 성과 분석과 리포트 작성 등 실제 업무를 경험하며 기본기를 쌓겠습니다. 초기에는 주어진 업무를 정확하게 수행하는 것에서 시작하되, 단순히 성과의 변화를 확인하는 데 그치지 않고 왜 그런 결과가 나왔는지 데이터를 통해 원인을 파악할 수 있는 AE로 성장하겠습니다.",
  "솔루션 사업 부문의 업무 방식에도 빠르게 적응하겠습니다. AI와 자동화 솔루션이 캠페인 운영에서 어떤 역할을 하고, 이를 통해 확보한 데이터와 시간을 마케터가 어떻게 분석과 의사결정에 활용하는지 실무를 통해 익히겠습니다. 새로운 기술과 도구를 직접 찾아 적용해온 개발 경험을 바탕으로 AI와 솔루션을 적극적으로 활용하되, <strong>기술을 사용하는 것 자체보다 이를 통해 더 나은 판단과 성과를 만드는 데 집중하겠습니다.</strong>",
  "경험이 쌓인 이후에는 개별 캠페인의 효율만 보는 것에서 한 단계 더 나아가고 싶습니다. 다양한 산업과 광고주의 캠페인을 경험하며 고객의 비즈니스와 목표를 이해하고, 성과 데이터와 시장의 변화를 함께 살펴 더 나은 전략을 고민하겠습니다. 비딩과 제안 과정에도 적극적으로 참여하며 특정 매체의 성과만 보는 것이 아니라, 고객의 목표에 맞춰 여러 매체와 전략을 함께 고민할 수 있는 시야를 갖추겠습니다.",
  "궁극적으로는 광고주의 요청에 따라 캠페인을 운영하는 데 머무르지 않고, <strong>데이터에서 문제와 기회를 먼저 발견하고 기술과 솔루션을 활용해 더 나은 전략을 제안할 수 있는 AE</strong>로 성장하고 싶습니다. 캠페인의 결과를 분석하고 개선하는 것뿐만 아니라, 실제 운영 과정에서 얻은 경험과 피드백을 다시 더 나은 솔루션 활용과 마케팅 성과로 연결하며 매드업의 솔루션 사업 부문과 함께 성장하는 퍼포먼스 마케터가 되겠습니다."
]
