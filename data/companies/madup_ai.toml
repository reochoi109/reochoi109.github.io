hero_lead_ko = "개인 웹서비스와 스마트스토어를 운영하며 작은 실행이 노출 결과를 바꾸는 과정을 경험했습니다. 개발을 통해 익힌 문제 해결 방식과 기술 활용 경험을 바탕으로, 데이터와 AI를 활용해 광고주의 성장을 만드는 매드업에서 성과 개선에 기여하고자 합니다."
hero_lead_en = "I want to bring the problem-solving and technical perspective I built in backend engineering to MADUP, using data to identify causes and propose better next actions."

motivation_ko = [
  "개인 웹서비스와 스마트스토어를 운영하면서 게시글 제목과 태그, 상품명과 검색 키워드를 바꾸고 노출 결과를 확인했습니다. 작은 변화에도 결과가 달라지는 것을 보며 직접 시도하고 그 결과를 확인하는 과정에 흥미를 느꼈습니다. 이러한 경험을 계기로 데이터를 바탕으로 성과를 분석하고 개선해 나가는 퍼포먼스 마케팅을 새로운 진로로 선택했습니다.",
  "매드업의 솔루션 사업 부문에 지원한 이유는 <strong>AI와 자동화를 활용해 반복적인 실행 업무를 줄이고, 마케터가 데이터 분석과 전략적 판단에 더욱 집중하는 방식</strong>에 매력을 느꼈기 때문입니다. 특히 단순한 광고 집행을 넘어 데이터를 바탕으로 캠페인을 지속적으로 최적화하고, 다양한 매체와 전략을 통해 광고주의 성장을 돕는다는 점에서 제가 성장하고 싶은 방향과 맞닿아 있다고 생각했습니다.",
  "저에게도 이와 연결되는 경험이 있습니다. 퍼포먼스 마케터가 PC와 모바일에서 검색광고의 노출 위치를 반복적으로 확인하는 업무를 보고, 이를 자동으로 확인할 수 있는 도구 개발을 도운 적이 있습니다. 규모가 큰 프로젝트는 아니었지만, <strong>실제 마케팅 업무에서 발생하는 문제를 발견하고 기술을 활용해 해결해본 경험</strong>이었습니다. 개발자로서 쌓아온 기술과 문제 해결 경험을 이제는 마케팅의 실행과 성과를 만드는 데 활용하고 싶습니다.",
  "매드업에서는 먼저 퍼포먼스 마케팅의 기본기를 빠르게 갖추고, 다양한 캠페인과 광고주를 경험하며 데이터를 성과 개선으로 연결하는 역량을 키우겠습니다. 여기에 개발자로서 쌓은 데이터와 기술에 대한 이해를 더해 <strong>AI와 다양한 도구를 적극적으로 활용하면서도, 그 결과를 바탕으로 더 나은 판단과 전략을 제안할 수 있는 퍼포먼스 마케터</strong>로 성장하고자 지원했습니다."
]

future_ko = [
  "입사 초기에는 퍼포먼스 마케터로서 기본기를 빠르게 갖추는 데 집중하겠습니다. 다양한 광고 매체와 주요 지표를 익히고, 캠페인 운영과 최적화, 성과 분석과 리포트 작성 등 실무를 정확하게 수행할 수 있는 역량부터 갖추겠습니다. 동시에 솔루션 사업 부문의 AI와 자동화 도구가 실제 캠페인 운영에 어떻게 활용되는지 적극적으로 익히며, <strong>단순히 결과를 확인하는 것이 아니라 왜 그런 결과가 나왔는지 설명할 수 있는 AE</strong>로 성장하겠습니다.",
  "실무 경험이 쌓인 이후에는 개발자로서 익힌 문제 해결 방식과 기술에 대한 이해를 적극적으로 활용하겠습니다. 반복적인 업무에는 AI와 자동화 도구를 활용하고, 확보한 시간과 데이터를 분석과 판단에 집중하는 데 사용하겠습니다. 또한 다양한 산업과 광고주의 캠페인을 경험하며 개별 지표의 변화만 보는 것이 아니라, 광고주의 비즈니스와 목표를 이해하고 여러 매체와 전략을 함께 바라볼 수 있는 시야를 넓히겠습니다.",
  "궁극적으로는 주어진 캠페인을 운영하는 데 머무르지 않고, <strong>광고주의 목표를 이해한 뒤 데이터에서 문제와 기회를 먼저 발견하고 더 나은 전략을 제안할 수 있는 AE</strong>가 되고 싶습니다. 기술과 데이터를 효과적으로 활용하면서도 결국 중요한 것은 광고주의 성과라는 점을 잊지 않고, 분석과 실행을 실제 성과 개선으로 연결할 수 있는 퍼포먼스 마케터로 성장하겠습니다."
]
