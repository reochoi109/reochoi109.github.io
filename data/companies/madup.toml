  "실무에 충분히 적응한 이후에는 개발자로서 익힌 문제 해결 방식과 기술 활용 경험도 적극적으로 더하겠습니다. 반복적으로 많은 시간이 필요한 업무는 AI와 자동화를 활용해 효율화하고, 필요한 데이터를 더 효과적으로 활용할 방법이 있다면 직접 찾아 적용하겠습니다. 기술을 사용하는 것 자체를 목적으로 삼기보다, <strong>기술을 통해 확보한 시간과 정보를 더 중요한 분석과 판단에 활용하겠습니다.</strong>",
  "궁극적으로는 광고주의 요청에 따라 캠페인을 운영하는 것에 머무르지 않고, <strong>데이터에서 먼저 문제와 기회를 발견하고 더 나은 방향을 제안할 수 있는 AE</strong>가 되고 싶습니다. 광고주의 비즈니스를 이해하고 성과가 달라진 이유를 끝까지 파고들며, 실행과 분석을 통해 실제 성과 개선으로 연결할 수 있는 퍼포먼스 마케터로 성장하겠습니다."
