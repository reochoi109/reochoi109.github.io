hero_lead_ko = "개인 웹서비스와 스마트스토어를 운영하며 작은 실행이 노출 결과를 바꾸는 과정을 경험했습니다. 개발을 통해 익힌 문제 해결 방식과 기술 활용 경험을 바탕으로, 데이터와 AI를 활용해 광고주의 성장을 만드는 매드업에서 성과 개선에 기여하고자 합니다."
hero_lead_en = "I want to bring the problem-solving and technical perspective I built in backend engineering to MADUP, using data to identify causes and propose better next actions."

motivation_ko = [
  "개인 웹서비스와 스마트스토어를 운영하면서 게시글 제목과 태그, 상품명과 검색 키워드를 바꾸고 노출 결과를 확인했습니다. 작은 변화에도 결과가 달라지는 것을 보며, 직접 시도하고 데이터를 확인해 다음 방법을 고민하는 과정에 흥미를 느꼈습니다. 이러한 경험을 계기로 실행의 결과를 데이터로 확인하고 지속적으로 개선해 나가는 퍼포먼스 마케팅을 새로운 진로로 선택했습니다.",
  "그중에서도 매드업에 지원한 이유는 <strong>데이터와 기술을 활용해 마케터가 더 중요한 판단에 집중할 수 있도록 하는 방향</strong>에 공감했기 때문입니다. AI와 자동화를 캠페인 운영에 활용해 반복적인 업무를 줄이고, 마케터가 데이터를 바탕으로 성과를 분석하고 다음 전략을 고민하는 데 집중한다는 점이 특히 인상 깊었습니다.",
  "개발자로 일하며 반복적인 작업을 줄이고 문제를 효율적으로 해결하는 데 기술을 활용해왔습니다. 또한 퍼포먼스 마케터가 PC와 모바일에서 검색광고의 노출 위치를 반복적으로 확인하는 업무를 보고, 이를 자동으로 확인할 수 있는 도구 개발을 도운 경험이 있습니다. 작은 시도였지만 기술을 활용해 마케터의 반복 업무를 직접 줄여보면서, 기술이 마케팅의 실행과 판단을 어떻게 도울 수 있는지 경험할 수 있었습니다.",
  "이러한 경험은 개발자에서 마케터로 전환하는 과정에서도 제가 가진 강점이라고 생각합니다. 개발자로서 익혀온 <strong>문제를 정의하고, 데이터를 확인하고, 가설을 검증하며 개선하는 방식</strong>에 퍼포먼스 마케팅의 역량을 더해가겠습니다. 기술을 잘 아는 것에 머무르지 않고 이를 마케팅 성과를 만드는 데 활용하며, 데이터에서 다음 액션을 찾고 실제 성과 개선에 기여하는 퍼포먼스 마케터로 성장하고 싶어 매드업에 지원했습니다."
]

future_ko = [
  "입사 후 가장 먼저 해야 할 일은 퍼포먼스 마케터로서 실무에 빠르게 적응하는 것이라고 생각합니다. 다양한 광고 매체와 주요 지표, 캠페인 운영 방식과 리포트 작성 과정을 익히고 실제 업무에 적용하겠습니다. 단순히 성과가 올랐거나 떨어졌다는 결과를 확인하는 데 그치지 않고, <strong>왜 그런 결과가 나왔는지 질문하고 데이터를 통해 원인을 파악해 더 나은 방법을 제안할 수 있는 AE</strong>로 성장하겠습니다.",
