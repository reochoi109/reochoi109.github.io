[[categories]]
name = "배열 · 문자열"
description = "순회, 구간과 문자열 처리"
patterns = ["누적 합", "투 포인터", "슬라이딩 윈도우"]

[[categories]]
name = "해시"
description = "빠른 조회와 빈도 계산"
patterns = ["해시 맵", "해시 집합", "카운팅"]

[[categories]]
name = "스택 · 큐"
description = "처리 순서와 상태 관리"
patterns = ["스택", "큐", "모노토닉 스택"]

[[categories]]
name = "그래프"
description = "정점과 간선으로 관계 표현"
patterns = ["인접 리스트", "위상 정렬", "Union-Find"]

[[categories]]
name = "BFS"
description = "가까운 상태부터 너비 우선 탐색"
patterns = ["레벨 탐색", "최단 거리", "다중 시작점"]

[[categories]]
name = "DFS"
description = "경로를 깊게 탐색하고 되돌아오기"
patterns = ["재귀", "백트래킹", "연결 요소"]

[[categories]]
name = "이분 탐색"
description = "정렬된 범위와 정답 공간 탐색"
patterns = ["Lower Bound", "Upper Bound", "매개변수 탐색"]

[[categories]]
name = "그리디"
description = "현재의 최선 선택을 누적"
patterns = ["정렬", "구간 선택", "우선순위 큐"]

[[categories]]
name = "동적 계획법"
description = "중복 부분 문제의 결과 재사용"
patterns = ["1차원 DP", "2차원 DP", "배낭 문제"]

[[categories]]
name = "최단 경로"
description = "가중 그래프의 최소 비용 탐색"
patterns = ["다익스트라", "벨만-포드", "플로이드-워셜"]
