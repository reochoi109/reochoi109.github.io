transition = [
  "연극을 처음 시작한 것은 소극적인 제 모습을 바꿔보고 싶어서였습니다. 사람들 앞에 나서는 것도 어려웠지만 무대에 오르며 부족한 점을 하나씩 채웠고, 약 10년간 연극을 이어갔습니다. 대학에서는 연극영화를 전공하며 연기·조명·무대 제작을 경험했습니다.",
  "연극을 통해 처음에는 부족하더라도 꾸준히 배우고 시도하면 달라질 수 있다는 것을 배웠습니다. 이 경험은 비전공자로 개발을 처음부터 배우고 새로운 환경에 적응하는 과정에서도 바탕이 되었습니다.",
  "2022년 백엔드 개발자 과정을 수료하고 라온로드에서 인턴으로 실무를 시작했습니다. 문제를 만나면 자료를 찾아보고, 혼자 해결하기 어려울 때는 동료에게 질문하며 원인을 좁혀갔습니다. 이후 정규직으로 전환되어 기존 서비스 유지보수부터 새로운 중계 서버의 설계·개발까지 맡았습니다."
