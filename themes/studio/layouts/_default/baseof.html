<!doctype html>
<html
  lang="{{ or site.Language.LanguageCode }}"
  dir="{{ or site.Language.LanguageDirection `ltr` }}"
>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ if eq .Layout "about" }}about-page{{ end }}{{ if .Params.standalone }} standalone-page{{ end }}">
    {{- if not .Params.standalone }}
      <header class="site-header">
        <div class="container header-inner">{{ partial "header.html" . }}</div>
      </header>
    {{- end }}

    <main id="content" class="container site-main">
      {{ block "main" . }}{{ end }}
    </main>

    {{- if not .Params.standalone }}
      <footer class="site-footer">
        <div class="container">{{ partial "footer.html" . }}</div>
      </footer>
    {{- end }}
  </body>
</html>
