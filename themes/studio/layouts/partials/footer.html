{{- $brand := site.Params.brand | default site.Title -}}
{{- $email := site.Params.email | default "" -}}
<div class="footer-inner">
  <div class="footer-top">
    <div class="footer-brand">
      <div class="footer-title" aria-label="{{ $brand }}"><span class="footer-wordmark" aria-hidden="true">Reo</span></div>
      {{- with $email -}}
        <div class="footer-email">
          <a href="mailto:{{ . }}">{{ . }}</a>
        </div>
      {{- end -}}
    </div>
  </div>

  <div class="footer-bottom">
    <div class="footer-meta">
      © {{ now.Year }}. {{ site.Params.author | default site.Title }}. All rights reserved.
    </div>
  </div>
</div>
