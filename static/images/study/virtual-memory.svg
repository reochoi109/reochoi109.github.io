<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">가상 메모리 주소 변환</title>
  <desc id="desc">가상 페이지가 페이지 테이블을 거쳐 물리 프레임에 매핑되는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#5f72d9"/></marker></defs>
  <rect width="800" height="420" rx="28" fill="#f6f8fb"/>
  <text x="50" y="58" fill="#172033" font-family="sans-serif" font-size="25" font-weight="700">Virtual address translation</text>
  <g font-family="sans-serif">
    <text x="60" y="102" fill="#59677a" font-size="15" font-weight="700">VIRTUAL PAGES</text>
    <text x="326" y="102" fill="#59677a" font-size="15" font-weight="700">PAGE TABLE</text>
    <text x="592" y="102" fill="#59677a" font-size="15" font-weight="700">PHYSICAL FRAMES</text>
    <g text-anchor="middle" font-weight="700">
      <g fill="#e8edff" stroke="#6678df" stroke-width="2">
        <rect x="58" y="125" width="150" height="54" rx="12"/><rect x="58" y="190" width="150" height="54" rx="12"/><rect x="58" y="255" width="150" height="54" rx="12"/>
      </g>
      <text x="133" y="158" fill="#4859bd">page 0</text><text x="133" y="223" fill="#4859bd">page 1</text><text x="133" y="288" fill="#4859bd">page 2</text>
      <g fill="#fff" stroke="#aab5c5" stroke-width="2">
        <rect x="320" y="125" width="160" height="54" rx="12"/><rect x="320" y="190" width="160" height="54" rx="12"/><rect x="320" y="255" width="160" height="54" rx="12"/>
      </g>
      <text x="400" y="158" fill="#59677a">0 → frame 3</text><text x="400" y="223" fill="#59677a">1 → frame 0</text><text x="400" y="288" fill="#59677a">2 → disk</text>
      <g fill="#eafaf2" stroke="#27a66b" stroke-width="2">
        <rect x="586" y="125" width="156" height="54" rx="12"/><rect x="586" y="190" width="156" height="54" rx="12"/><rect x="586" y="255" width="156" height="54" rx="12"/><rect x="586" y="320" width="156" height="54" rx="12"/>
      </g>
      <text x="664" y="158" fill="#197849">frame 0</text><text x="664" y="223" fill="#197849">frame 1</text><text x="664" y="288" fill="#197849">frame 2</text><text x="664" y="353" fill="#197849">frame 3</text>
    </g>
    <path d="M210 152h96M480 152l92 190" stroke="#5f72d9" stroke-width="3" marker-end="url(#a)"/>
    <path d="M210 217h96M480 217l92-58" stroke="#5f72d9" stroke-width="3" marker-end="url(#a)"/>
    <path d="M210 282h96" stroke="#5f72d9" stroke-width="3" marker-end="url(#a)"/>
    <text x="318" y="335" fill="#c16b1a" font-size="14" font-weight="700">not resident → page fault</text>
  </g>
</svg>
