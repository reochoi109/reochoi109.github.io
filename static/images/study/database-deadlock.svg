<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Database Deadlock 순환 대기</title>
  <desc id="desc">Transaction 1이 Row A를 가진 채 Row B를 기다리고 Transaction 2가 Row B를 가진 채 Row A를 기다리는 순환</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#d9556b"/></marker></defs>
  <rect width="900" height="480" rx="30" fill="#f6f8fb"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="450" y="60" fill="#172033" font-size="27" font-weight="700">Wait-for cycle</text>
    <rect x="90" y="150" width="220" height="100" rx="20" fill="#e8f2ff" stroke="#3978e6" stroke-width="2"/><text x="200" y="190" fill="#1769d2" font-size="19" font-weight="700">TRANSACTION 1</text><text x="200" y="220" fill="#66758a" font-size="14">holds Row A</text>
    <rect x="590" y="150" width="220" height="100" rx="20" fill="#f5edff" stroke="#9467d8" stroke-width="2"/><text x="700" y="190" fill="#7140b5" font-size="19" font-weight="700">TRANSACTION 2</text><text x="700" y="220" fill="#66758a" font-size="14">holds Row B</text>
    <path d="M310 176C420 104 490 104 590 176" fill="none" stroke="#d9556b" stroke-width="4" marker-end="url(#a)"/><text x="450" y="116" fill="#c13f55" font-size="15" font-weight="700">waits for Row B</text>
    <path d="M590 226C490 316 410 316 310 226" fill="none" stroke="#d9556b" stroke-width="4" marker-end="url(#a)"/><text x="450" y="316" fill="#c13f55" font-size="15" font-weight="700">waits for Row A</text>
    <rect x="238" y="372" width="424" height="62" rx="16" fill="#fff4e8" stroke="#e8872f"/><text x="450" y="397" fill="#a95a14" font-size="15" font-weight="700">DBMS detects cycle → choose victim → rollback</text><text x="450" y="420" fill="#66758a" font-size="12">application should retry safely</text>
  </g>
</svg>
