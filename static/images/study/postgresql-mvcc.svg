<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL MVCC 가시성</title>
  <desc id="desc">두 트랜잭션 Snapshot이 같은 논리 행의 서로 다른 버전을 보는 구조</desc>
  <rect width="900" height="430" rx="28" fill="#f6f8fb"/>
  <text x="52" y="58" fill="#172033" font-family="sans-serif" font-size="25" font-weight="700">PostgreSQL MVCC · row visibility</text>
  <g font-family="sans-serif">
    <rect x="58" y="105" width="250" height="112" rx="18" fill="#e8f2ff" stroke="#3978e6" stroke-width="2"/>
    <text x="83" y="140" fill="#1769d2" font-size="17" font-weight="700">TRANSACTION A</text>
    <text x="83" y="170" fill="#59677a" font-size="14">snapshot before update</text>
    <text x="83" y="195" fill="#172033" font-size="15" font-weight="700">sees version v1</text>
    <rect x="58" y="250" width="250" height="112" rx="18" fill="#fff4e8" stroke="#e8872f" stroke-width="2"/>
    <text x="83" y="285" fill="#a95a14" font-size="17" font-weight="700">TRANSACTION B</text>
    <text x="83" y="315" fill="#7f6b59" font-size="14">snapshot after commit</text>
    <text x="83" y="340" fill="#172033" font-size="15" font-weight="700">sees version v2</text>
    <path d="M308 160h135M308 306h135" stroke="#8fa0b8" stroke-width="3"/>
    <rect x="443" y="101" width="204" height="119" rx="18" fill="#fff" stroke="#27a66b" stroke-width="2"/>
    <text x="545" y="136" text-anchor="middle" fill="#197849" font-size="18" font-weight="700">ROW VERSION · v1</text>
    <text x="470" y="170" fill="#59677a" font-size="13">value = "old"</text>
    <text x="470" y="194" fill="#59677a" font-size="13">visible to older snapshot</text>
    <rect x="443" y="246" width="204" height="119" rx="18" fill="#fff" stroke="#e8872f" stroke-width="2"/>
    <text x="545" y="281" text-anchor="middle" fill="#a95a14" font-size="18" font-weight="700">ROW VERSION · v2</text>
    <text x="470" y="315" fill="#59677a" font-size="13">value = "new"</text>
    <text x="470" y="339" fill="#59677a" font-size="13">visible after commit</text>
    <path d="M647 160h88M647 306h88" stroke="#8fa0b8" stroke-width="3"/>
    <rect x="735" y="128" width="120" height="210" rx="18" fill="#eef1f5" stroke="#aab5c5" stroke-width="2"/>
    <text x="795" y="165" text-anchor="middle" fill="#59677a" font-size="15" font-weight="700">TABLE HEAP</text>
    <circle cx="795" cy="218" r="31" fill="#eafaf2" stroke="#27a66b"/><text x="795" y="224" text-anchor="middle" fill="#197849" font-size="15" font-weight="700">v1</text>
    <circle cx="795" cy="290" r="31" fill="#fff4e8" stroke="#e8872f"/><text x="795" y="296" text-anchor="middle" fill="#a95a14" font-size="15" font-weight="700">v2</text>
  </g>
</svg>
