<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">TCP 3-way handshake</title>
  <desc id="desc">클라이언트와 서버가 SYN, SYN ACK, ACK를 교환하는 흐름</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#2678e8"/></marker></defs>
  <rect width="800" height="420" rx="28" fill="#f6f8fb"/>
  <text x="52" y="58" fill="#172033" font-family="sans-serif" font-size="25" font-weight="700">TCP connection establishment</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="74" y="92" width="170" height="58" rx="16" fill="#e8f2ff" stroke="#2678e8" stroke-width="2"/>
    <rect x="556" y="92" width="170" height="58" rx="16" fill="#eafaf2" stroke="#27a66b" stroke-width="2"/>
    <text x="159" y="128" fill="#1769d2" font-size="19" font-weight="700">CLIENT</text>
    <text x="641" y="128" fill="#197849" font-size="19" font-weight="700">SERVER</text>
    <path d="M159 150v226M641 150v226" stroke="#b4becc" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M170 196L625 238" stroke="#2678e8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="400" y="201" fill="#1769d2" font-size="17" font-weight="700">1 · SYN, seq=x</text>
    <path d="M630 272L175 313" stroke="#2678e8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="400" y="271" fill="#1769d2" font-size="17" font-weight="700">2 · SYN-ACK, seq=y, ack=x+1</text>
    <path d="M170 340L625 370" stroke="#2678e8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="400" y="347" fill="#1769d2" font-size="17" font-weight="700">3 · ACK, ack=y+1</text>
  </g>
</svg>
