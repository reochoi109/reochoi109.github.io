<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Database Key의 포함 관계</title>
  <desc id="desc">Super Key 안에 Candidate Key가 있고 그중 Primary Key와 Alternate Key를 선택하며 Composite Key는 여러 속성으로 구성될 수 있음</desc>
  <rect width="920" height="500" rx="30" fill="#f6f8fb"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="460" y="58" fill="#172033" font-size="27" font-weight="700">Keys · uniqueness and minimality</text>
    <rect x="82" y="100" width="756" height="330" rx="28" fill="#e8f2ff" stroke="#3978e6" stroke-width="2"/>
    <text x="160" y="136" fill="#1769d2" font-size="18" font-weight="700">SUPER KEY</text>
    <rect x="160" y="162" width="600" height="214" rx="24" fill="#fff" stroke="#27a66b" stroke-width="2"/>
    <text x="260" y="198" fill="#197849" font-size="18" font-weight="700">CANDIDATE KEY</text>
    <rect x="205" y="232" width="220" height="98" rx="18" fill="#fff4e8" stroke="#e8872f" stroke-width="2"/><text x="315" y="272" fill="#a95a14" font-size="17" font-weight="700">PRIMARY KEY</text><text x="315" y="299" fill="#66758a" font-size="13">대표로 선택한 하나의 제약</text>
    <rect x="495" y="232" width="220" height="98" rx="18" fill="#f5edff" stroke="#9467d8" stroke-width="2"/><text x="605" y="272" fill="#7140b5" font-size="17" font-weight="700">ALTERNATE KEY</text><text x="605" y="299" fill="#66758a" font-size="13">선택되지 않은 후보</text>
    <text x="460" y="404" fill="#66758a" font-size="14">Composite Key는 둘 이상의 Column으로 위 Key들을 구성하는 형태</text>
    <text x="460" y="464" fill="#172033" font-size="15" font-weight="700">Foreign Key → 다른 Table의 고유한 Candidate Key를 참조</text>
  </g>
</svg>
