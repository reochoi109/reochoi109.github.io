<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">OSI 7계층과 TCP/IP 4계층 비교</title>
  <desc id="desc">OSI의 응용, 표현, 세션 계층이 TCP/IP 응용 계층으로, 전송 계층은 전송 계층으로, 네트워크 계층은 인터넷 계층으로, 데이터 링크와 물리 계층은 네트워크 접근 계층으로 대응되는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0l9 3-9 3z" fill="#7d8ca2"/>
    </marker>
  </defs>
  <rect width="1000" height="610" rx="30" fill="url(#bg)"/>
  <g font-family="sans-serif">
    <text x="52" y="58" fill="#172033" font-size="27" font-weight="700">Network layer models</text>
    <text x="52" y="86" fill="#66758a" font-size="15">참조 모델과 실제 인터넷 프로토콜 스택의 역할 대응</text>

    <text x="190" y="132" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">OSI 7 Layer</text>
    <text x="730" y="132" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">TCP/IP 4 Layer</text>

    <g font-size="16" font-weight="700" text-anchor="middle">
      <rect x="70" y="154" width="240" height="52" rx="12" fill="#e8f2ff" stroke="#3978e6" stroke-width="2"/>
      <text x="190" y="186" fill="#1769d2">7 · 응용 Application</text>
      <rect x="70" y="213" width="240" height="52" rx="12" fill="#e8f2ff" stroke="#3978e6" stroke-width="2"/>
      <text x="190" y="245" fill="#1769d2">6 · 표현 Presentation</text>
      <rect x="70" y="272" width="240" height="52" rx="12" fill="#e8f2ff" stroke="#3978e6" stroke-width="2"/>
      <text x="190" y="304" fill="#1769d2">5 · 세션 Session</text>

      <rect x="70" y="337" width="240" height="52" rx="12" fill="#eafaf2" stroke="#27a66b" stroke-width="2"/>
      <text x="190" y="369" fill="#197849">4 · 전송 Transport</text>
      <rect x="70" y="402" width="240" height="52" rx="12" fill="#fff4e8" stroke="#e8872f" stroke-width="2"/>
      <text x="190" y="434" fill="#a95a14">3 · 네트워크 Network</text>
      <rect x="70" y="467" width="240" height="52" rx="12" fill="#f5edff" stroke="#9467d8" stroke-width="2"/>
      <text x="190" y="499" fill="#7140b5">2 · 데이터 링크 Data Link</text>
      <rect x="70" y="526" width="240" height="52" rx="12" fill="#f5edff" stroke="#9467d8" stroke-width="2"/>
      <text x="190" y="558" fill="#7140b5">1 · 물리 Physical</text>

      <rect x="610" y="154" width="240" height="170" rx="18" fill="#e8f2ff" stroke="#3978e6" stroke-width="2"/>
      <text x="730" y="224" fill="#1769d2" font-size="19">응용 Application</text>
      <text x="730" y="252" fill="#65758b" font-size="13" font-weight="500">HTTP · DNS · TLS · SSH</text>
      <rect x="610" y="337" width="240" height="52" rx="12" fill="#eafaf2" stroke="#27a66b" stroke-width="2"/>
      <text x="730" y="369" fill="#197849">전송 Transport</text>
      <rect x="610" y="402" width="240" height="52" rx="12" fill="#fff4e8" stroke="#e8872f" stroke-width="2"/>
      <text x="730" y="434" fill="#a95a14">인터넷 Internet</text>
      <rect x="610" y="467" width="240" height="111" rx="18" fill="#f5edff" stroke="#9467d8" stroke-width="2"/>
      <text x="730" y="516" fill="#7140b5">네트워크 접근</text>
      <text x="730" y="542" fill="#65758b" font-size="13" font-weight="500">Ethernet · Wi-Fi</text>
    </g>

    <g fill="none" stroke="#7d8ca2" stroke-width="2.2" marker-end="url(#arrow)">
      <path d="M325 180C450 180 480 180 594 180"/>
      <path d="M325 239C450 239 480 239 594 239"/>
      <path d="M325 298C450 298 480 298 594 298"/>
      <path d="M325 363H594"/>
      <path d="M325 428H594"/>
      <path d="M325 493C450 493 480 493 594 493"/>
      <path d="M325 552C450 552 480 552 594 552"/>
    </g>

    <g fill="#65758b" font-size="11">
      <text x="870" y="230">Data</text>
      <text x="870" y="368">Segment / Datagram</text>
      <text x="870" y="433">Packet</text>
      <text x="870" y="520">Frame / Bits</text>
    </g>
  </g>
</svg>
