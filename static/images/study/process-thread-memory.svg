<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Process 주소 공간과 Thread Memory 공유</title>
  <desc id="desc">같은 Process의 Thread들이 Code Data Heap을 공유하고 각자 Stack과 CPU Register를 갖는 구조</desc>
  <rect width="1000" height="590" rx="30" fill="#f6f8fb"/>
  <g font-family="sans-serif">
    <text x="52" y="60" fill="#172033" font-size="27" font-weight="700">One process · multiple execution flows</text>
    <text x="52" y="88" fill="#66758a" font-size="15">공유하는 주소 공간과 Thread마다 독립적인 실행 상태</text>
    <rect x="70" y="120" width="860" height="406" rx="26" fill="#fff" stroke="#3978e6" stroke-width="2"/>
    <text x="104" y="158" fill="#1769d2" font-size="18" font-weight="700">PROCESS · virtual address space</text>
    <g text-anchor="middle"><rect x="110" y="190" width="490" height="58" rx="13" fill="#e8f2ff" stroke="#3978e6"/><text x="355" y="225" fill="#1769d2" font-size="16" font-weight="700">CODE · machine instructions</text>
    <rect x="110" y="262" width="490" height="58" rx="13" fill="#eafaf2" stroke="#27a66b"/><text x="355" y="297" fill="#197849" font-size="16" font-weight="700">DATA / BSS · global state</text>
    <rect x="110" y="334" width="490" height="148" rx="13" fill="#fff4e8" stroke="#e8872f"/><text x="355" y="377" fill="#a95a14" font-size="16" font-weight="700">HEAP · dynamic objects</text><text x="355" y="408" fill="#66758a" font-size="13">shared access needs synchronization</text></g>
    <g text-anchor="middle"><rect x="650" y="190" width="110" height="292" rx="15" fill="#f5edff" stroke="#9467d8"/><rect x="780" y="190" width="110" height="292" rx="15" fill="#f5edff" stroke="#9467d8"/><text x="705" y="222" fill="#7140b5" font-size="15" font-weight="700">THREAD 1</text><text x="835" y="222" fill="#7140b5" font-size="15" font-weight="700">THREAD 2</text><text x="705" y="274" fill="#66758a" font-size="13">registers</text><text x="835" y="274" fill="#66758a" font-size="13">registers</text><path d="M671 300h68v142h-68zM801 300h68v142h-68z" fill="#fff" stroke="#9467d8"/><text x="705" y="358" fill="#7140b5" font-size="14" font-weight="700">own</text><text x="705" y="382" fill="#7140b5" font-size="14" font-weight="700">stack</text><text x="835" y="358" fill="#7140b5" font-size="14" font-weight="700">own</text><text x="835" y="382" fill="#7140b5" font-size="14" font-weight="700">stack</text></g>
    <text x="500" y="558" text-anchor="middle" fill="#66758a" font-size="14">files · credentials · mappings are process resources</text>
  </g>
</svg>
