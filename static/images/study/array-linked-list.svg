<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">배열과 연결 리스트의 메모리 구조</title>
  <desc id="desc">배열은 연속된 주소에 원소를 저장하고 연결 리스트는 흩어진 노드를 포인터로 연결하는 비교</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0l8 3-8 3z" fill="#9467d8"/></marker></defs>
  <rect width="1000" height="500" rx="30" fill="#f6f8fb"/>
  <g font-family="sans-serif">
    <text x="52" y="60" fill="#172033" font-size="27" font-weight="700">Array vs Linked List</text>
    <text x="52" y="88" fill="#66758a" font-size="15">물리적 배치가 접근 비용과 Cache Locality를 바꾼다</text>
    <text x="72" y="150" fill="#1769d2" font-size="18" font-weight="700">ARRAY · contiguous memory</text>
    <g text-anchor="middle" font-size="17" font-weight="700"><rect x="72" y="180" width="150" height="92" rx="13" fill="#e8f2ff" stroke="#3978e6"/><rect x="222" y="180" width="150" height="92" fill="#e8f2ff" stroke="#3978e6"/><rect x="372" y="180" width="150" height="92" fill="#e8f2ff" stroke="#3978e6"/><rect x="522" y="180" width="150" height="92" fill="#e8f2ff" stroke="#3978e6"/><text x="147" y="230" fill="#1769d2">A</text><text x="297" y="230" fill="#1769d2">B</text><text x="447" y="230" fill="#1769d2">C</text><text x="597" y="230" fill="#1769d2">D</text></g>
    <text x="704" y="220" fill="#66758a" font-size="14">base + i × size</text><text x="704" y="244" fill="#1769d2" font-size="14" font-weight="700">random access O(1)</text>
    <text x="72" y="336" fill="#7140b5" font-size="18" font-weight="700">LINKED LIST · nodes can be scattered</text>
    <g text-anchor="middle" font-size="15" font-weight="700"><rect x="72" y="366" width="150" height="70" rx="13" fill="#f5edff" stroke="#9467d8"/><rect x="300" y="366" width="150" height="70" rx="13" fill="#f5edff" stroke="#9467d8"/><rect x="574" y="366" width="150" height="70" rx="13" fill="#f5edff" stroke="#9467d8"/><text x="147" y="407" fill="#7140b5">A | next</text><text x="375" y="407" fill="#7140b5">B | next</text><text x="649" y="407" fill="#7140b5">C | null</text></g>
    <path d="M222 401h62M450 401h108" stroke="#9467d8" stroke-width="3" marker-end="url(#a)"/>
    <text x="770" y="395" fill="#66758a" font-size="14">follow pointers</text><text x="770" y="419" fill="#7140b5" font-size="14" font-weight="700">index lookup O(n)</text>
  </g>
</svg>
