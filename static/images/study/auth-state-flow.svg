<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Cookie, Session, JWT 인증 상태 흐름</title>
  <desc id="desc">브라우저 Cookie에 Session ID를 저장해 서버 저장소를 조회하는 방식과 JWT의 서명과 Claim을 검증하는 방식을 비교</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#3978e6"/></marker></defs>
  <rect width="1000" height="560" rx="30" fill="#f6f8fb"/>
  <g font-family="sans-serif">
    <text x="52" y="60" fill="#172033" font-size="27" font-weight="700">Authentication state · two common designs</text>
    <text x="52" y="88" fill="#66758a" font-size="15">Cookie는 전달 수단, Session과 JWT는 상태를 표현하는 설계</text>
    <rect x="52" y="130" width="896" height="170" rx="22" fill="#fff" stroke="#3978e6" stroke-width="2"/>
    <text x="78" y="166" fill="#1769d2" font-size="18" font-weight="700">SESSION ID</text>
    <rect x="92" y="198" width="190" height="64" rx="15" fill="#e8f2ff"/><text x="187" y="225" text-anchor="middle" fill="#1769d2" font-size="15" font-weight="700">Browser Cookie</text><text x="187" y="247" text-anchor="middle" fill="#66758a" font-size="12">random session id</text>
    <path d="M296 230h112" stroke="#3978e6" stroke-width="3" marker-end="url(#a)"/>
    <rect x="424" y="198" width="190" height="64" rx="15" fill="#eafaf2"/><text x="519" y="225" text-anchor="middle" fill="#197849" font-size="15" font-weight="700">Application Server</text><text x="519" y="247" text-anchor="middle" fill="#66758a" font-size="12">lookup session id</text>
    <path d="M628 230h112" stroke="#3978e6" stroke-width="3" marker-end="url(#a)"/>
    <rect x="756" y="198" width="154" height="64" rx="15" fill="#fff4e8"/><text x="833" y="225" text-anchor="middle" fill="#a95a14" font-size="15" font-weight="700">Session Store</text><text x="833" y="247" text-anchor="middle" fill="#66758a" font-size="12">state + expiry</text>
    <rect x="52" y="328" width="896" height="170" rx="22" fill="#fff" stroke="#9467d8" stroke-width="2"/>
    <text x="78" y="364" fill="#7140b5" font-size="18" font-weight="700">SIGNED JWT</text>
    <rect x="92" y="396" width="250" height="64" rx="15" fill="#f5edff"/><text x="217" y="423" text-anchor="middle" fill="#7140b5" font-size="15" font-weight="700">Header · Claims · Signature</text><text x="217" y="445" text-anchor="middle" fill="#66758a" font-size="12">client sends token</text>
    <path d="M356 428h112" stroke="#3978e6" stroke-width="3" marker-end="url(#a)"/>
    <rect x="484" y="396" width="214" height="64" rx="15" fill="#eafaf2"/><text x="591" y="423" text-anchor="middle" fill="#197849" font-size="15" font-weight="700">Verify signature</text><text x="591" y="445" text-anchor="middle" fill="#66758a" font-size="12">alg · key</text>
    <path d="M712 428h62" stroke="#3978e6" stroke-width="3" marker-end="url(#a)"/>
    <rect x="790" y="396" width="120" height="64" rx="15" fill="#fff4e8"/><text x="850" y="423" text-anchor="middle" fill="#a95a14" font-size="15" font-weight="700">Claims</text><text x="850" y="445" text-anchor="middle" fill="#66758a" font-size="12">iss · aud · exp</text>
  </g>
</svg>
