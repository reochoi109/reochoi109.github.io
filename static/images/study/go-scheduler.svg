<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Go G-M-P 스케줄러</title>
  <desc id="desc">여러 고루틴이 실행 큐를 거쳐 P와 M에 배정되는 구조</desc>
  <rect width="800" height="420" rx="28" fill="#f6f8fb"/>
  <text x="54" y="62" fill="#172033" font-family="sans-serif" font-size="25" font-weight="700">Go scheduler · simplified G-M-P</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#e8f2ff" stroke="#2b7fff" stroke-width="2">
      <rect x="54" y="112" width="112" height="62" rx="16"/><rect x="190" y="112" width="112" height="62" rx="16"/>
      <rect x="326" y="112" width="112" height="62" rx="16"/><rect x="462" y="112" width="112" height="62" rx="16"/>
    </g>
    <g fill="#1769d2" font-size="18" font-weight="700">
      <text x="110" y="150">G1</text><text x="246" y="150">G2</text><text x="382" y="150">G3</text><text x="518" y="150">G4</text>
    </g>
    <rect x="620" y="112" width="126" height="62" rx="16" fill="#fff" stroke="#aab5c5" stroke-width="2"/>
    <text x="683" y="139" fill="#172033" font-size="15" font-weight="700">RUN QUEUE</text>
    <text x="683" y="158" fill="#758196" font-size="13">runnable G</text>
    <path d="M110 190v42M246 190v42M382 190v42M518 190v42M683 190v42" stroke="#8fa0b8" stroke-width="3"/>
    <rect x="90" y="235" width="280" height="68" rx="18" fill="#eafaf2" stroke="#27a66b" stroke-width="2"/>
    <rect x="430" y="235" width="280" height="68" rx="18" fill="#eafaf2" stroke="#27a66b" stroke-width="2"/>
    <text x="230" y="264" fill="#197849" font-size="19" font-weight="700">P1 · processor context</text>
    <text x="230" y="285" fill="#5b6b63" font-size="14">local queue + execution token</text>
    <text x="570" y="264" fill="#197849" font-size="19" font-weight="700">P2 · processor context</text>
    <text x="570" y="285" fill="#5b6b63" font-size="14">local queue + execution token</text>
    <path d="M230 305v34M570 305v34" stroke="#8fa0b8" stroke-width="3"/>
    <rect x="130" y="342" width="200" height="48" rx="14" fill="#fff4e8" stroke="#e8872f" stroke-width="2"/>
    <rect x="470" y="342" width="200" height="48" rx="14" fill="#fff4e8" stroke="#e8872f" stroke-width="2"/>
    <text x="230" y="372" fill="#a95a14" font-size="17" font-weight="700">M1 · OS thread</text>
    <text x="570" y="372" fill="#a95a14" font-size="17" font-weight="700">M2 · OS thread</text>
  </g>
</svg>
