<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Headway와 GAP 계산 기준</title>
  <desc id="desc">오른쪽으로 주행하는 뒤차와 앞차의 앞부분 사이 차두시간, 뒤차 앞부분과 앞차 뒷부분 사이 차간시간, 앞차의 차량 길이를 설명하는 도식</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="carA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="carB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
    <marker id="blueStart" markerWidth="8" markerHeight="8" refX="1.5" refY="4" orient="auto">
      <path d="M8 0 0 4 8 8Z" fill="#2563eb"/>
    </marker>
    <marker id="blueEnd" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#2563eb"/>
    </marker>
    <marker id="coralStart" markerWidth="8" markerHeight="8" refX="1.5" refY="4" orient="auto">
      <path d="M8 0 0 4 8 8Z" fill="#f05a4f"/>
    </marker>
    <marker id="coralEnd" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#f05a4f"/>
    </marker>
    <marker id="navyStart" markerWidth="8" markerHeight="8" refX="1.5" refY="4" orient="auto">
      <path d="M8 0 0 4 8 8Z" fill="#334155"/>
    </marker>
    <marker id="navyEnd" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <rect x="44" y="38" width="1512" height="824" rx="32" fill="url(#panel)" stroke="#dbe5f2" stroke-width="2"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="965" y="104" text-anchor="middle" fill="#2563eb" font-size="44" font-weight="800">HEADWAY · 차두시간</text>
    <line x1="580" y1="158" x2="1350" y2="158" stroke="#2563eb" stroke-width="5" marker-start="url(#blueStart)" marker-end="url(#blueEnd)"/>

    <g fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 10" opacity=".8">
      <line x1="580" y1="176" x2="580" y2="508"/>
      <line x1="1350" y1="176" x2="1350" y2="508"/>
    </g>

    <text x="150" y="270" fill="#64748b" font-size="24" font-weight="700">뒤차</text>
    <text x="920" y="270" fill="#64748b" font-size="24" font-weight="700">앞차</text>

    <g transform="translate(580 330) scale(-1 1)" filter="url(#shadow)">
      <path d="M0 128 22 83 80 66 148 15 305 15 360 68 424 82 430 130 410 154 20 154Z" fill="url(#carA)" stroke="#153e9f" stroke-width="4"/>
      <path d="M118 65 165 28H294l43 40Z" fill="#172554" opacity=".88"/>
      <path d="M173 32v33M292 32l32 34" stroke="#93c5fd" stroke-width="3" opacity=".65"/>
      <rect x="10" y="105" width="22" height="14" rx="6" fill="#dbeafe"/>
      <rect x="403" y="103" width="20" height="16" rx="6" fill="#fb7185"/>
      <g fill="#0f172a" stroke="#fff" stroke-width="7">
        <circle cx="105" cy="150" r="42"/>
        <circle cx="345" cy="150" r="42"/>
      </g>
      <g fill="#94a3b8">
        <circle cx="105" cy="150" r="18"/>
        <circle cx="345" cy="150" r="18"/>
      </g>
    </g>

    <g transform="translate(1350 330) scale(-1 1)" filter="url(#shadow)">
      <path d="M0 128 22 83 80 66 148 15 305 15 360 68 424 82 430 130 410 154 20 154Z" fill="url(#carB)" stroke="#1d75b6" stroke-width="4"/>
      <path d="M118 65 165 28H294l43 40Z" fill="#172554" opacity=".82"/>
      <path d="M173 32v33M292 32l32 34" stroke="#dbeafe" stroke-width="3" opacity=".75"/>
      <rect x="10" y="105" width="22" height="14" rx="6" fill="#eff6ff"/>
      <rect x="403" y="103" width="20" height="16" rx="6" fill="#fb7185"/>
      <g fill="#0f172a" stroke="#fff" stroke-width="7">
        <circle cx="105" cy="150" r="42"/>
        <circle cx="345" cy="150" r="42"/>
      </g>
      <g fill="#94a3b8">
        <circle cx="105" cy="150" r="18"/>
        <circle cx="345" cy="150" r="18"/>
      </g>
    </g>

    <line x1="580" y1="500" x2="580" y2="700" stroke="#f05a4f" stroke-width="3" stroke-dasharray="10 10" opacity=".8"/>
    <line x1="920" y1="500" x2="920" y2="700" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10" opacity=".75"/>
    <line x1="1350" y1="500" x2="1350" y2="700" stroke="#334155" stroke-width="3" stroke-dasharray="10 10" opacity=".7"/>

    <line x1="580" y1="640" x2="920" y2="640" stroke="#f05a4f" stroke-width="5" marker-start="url(#coralStart)" marker-end="url(#coralEnd)"/>
    <line x1="920" y1="640" x2="1350" y2="640" stroke="#334155" stroke-width="5" marker-start="url(#navyStart)" marker-end="url(#navyEnd)"/>
    <text x="750" y="710" text-anchor="middle" fill="#e5483d" font-size="34" font-weight="800">GAP · 차간시간</text>
    <text x="1135" y="710" text-anchor="middle" fill="#334155" font-size="31" font-weight="800">VEHICLE LENGTH · 차량 길이</text>
  </g>
</svg>
