<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">TMS-DTN 비동기 중계 서버 처리 구조</title>
  <desc id="desc">웹 클라이언트의 요청을 DTN 중계 서버가 Kafka로 전달하고 결과를 저장한 뒤 WebSocket으로 재생하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#315be8"/></marker>
    <style>.t{font-family:Pretendard,'Noto Sans KR',sans-serif;fill:#121a2f}.h{font-size:40px;font-weight:800}.s{font-size:29px;font-weight:700}.n{font-size:23px;fill:#697083}.box{fill:#fff;stroke:#cfd5df;stroke-width:2}.own{fill:#eef3ff;stroke:#315be8;stroke-width:4}.line{fill:none;stroke:#315be8;stroke-width:5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <text x="70" y="78" class="t h">요청부터 결과 재생까지 서버 전체 담당</text>
  <rect x="70" y="245" width="210" height="145" rx="20" class="box"/>
  <text x="175" y="305" text-anchor="middle" class="t s">TMS Web</text><text x="175" y="342" text-anchor="middle" class="t n">분석 요청 · 재생</text>
  <rect x="385" y="175" width="330" height="285" rx="24" class="own"/>
  <text x="550" y="235" text-anchor="middle" class="t h">DTN 중계 서버</text>
  <text x="550" y="292" text-anchor="middle" class="t s">작업 상태 관리</text><text x="550" y="332" text-anchor="middle" class="t s">결과 저장</text><text x="550" y="372" text-anchor="middle" class="t s">WebSocket 재생</text>
  <rect x="820" y="150" width="300" height="120" rx="20" class="box"/>
  <text x="970" y="202" text-anchor="middle" class="t s">Kafka · Simulator</text><text x="970" y="237" text-anchor="middle" class="t n">요청 · 비동기 결과</text>
  <rect x="820" y="365" width="300" height="120" rx="20" class="box"/>
  <text x="970" y="417" text-anchor="middle" class="t s">PostgreSQL · JSONL</text><text x="970" y="452" text-anchor="middle" class="t n">상태 · 결과 파일</text>
  <path d="M280 318H385" class="line"/><path d="M715 245C760 245 770 210 820 210" class="line"/><path d="M820 245C770 245 760 285 715 285" class="line"/><path d="M715 390H820" class="line"/>
  <text x="550" y="560" text-anchor="middle" class="t s">비동기 작업 상태 → 결과 저장 → 세션별 재생</text>
</svg>
